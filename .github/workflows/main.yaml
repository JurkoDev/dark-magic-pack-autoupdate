on:
  push:
    branches:
      - master
name: deploy to mc server
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: gamesdal145.bisecthosting.com
          port: 2022
          protocol: ftps
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          server-dir: ./
          local-dir: ./minecraft/
          exclude: |
            **/mods/watermedia-*.jar
      - name: 🛜 Rcon Reload
        uses: wolfigster/rcon-action@v1.0.2
        with:
          server: ${{ secrets.Rcon_server }}
          port: 25566
          password: ${{ secrets.Rcon_password }}
          commands: '["reload"]'
